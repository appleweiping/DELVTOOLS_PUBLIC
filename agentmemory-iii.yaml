# agentmemory canonical iii config template (upgrade-immune)
#
# WHY THIS FILE EXISTS: the previous authority was
#   <root>\npm-global\node_modules\@agentmemory\agentmemory\dist\iii-config.yaml
# which lives INSIDE the npm package. Every `npm update` rewrote it back to
# relative paths (./data, node dist/index.mjs). With iii's cwd locked at
# the workstation root those relative exec/watch paths resolve to nothing, the watcher
# fails, the exec child never starts, and every /agentmemory/* call hangs.
# That was the recurring "port alive / app dead" outage (2026-06-10, 06-12).
#
# This file lives outside the package. `agentmemory-server.ps1` replaces the
# exact data-root and port tokens and atomically writes a local
# ignored active config before passing it to iii.exe. npm upgrades cannot reset the
# template. AgentMemory and the Host guard run outside iii under the tracked
# runtime supervisor, so iii config reloads cannot orphan either process.
#
# Hot reload: iii watches the generated ignored active config; self-heal appends
# a "# selfheal-reload:" marker there to reload without changing this template.

workers:
  - name: iii-worker-manager
    config:
      port: __AGENTMEMORY_ENGINE_PORT__
      host: 127.0.0.1
  - name: iii-http
    config:
      # Browser-facing HTTP is served by the authenticated Host guard on
      # __AGENTMEMORY_HTTP_PORT__. The upstream iii listener stays on a Fetch
      # bad port so browser fetch/WebSocket APIs cannot bypass that guard.
      port: __AGENTMEMORY_INTERNAL_REST_PORT__
      host: 127.0.0.1
      default_timeout: 180000
      cors:
        allowed_origins: ["http://localhost:__AGENTMEMORY_HTTP_PORT__", "http://127.0.0.1:__AGENTMEMORY_HTTP_PORT__", "http://agentmemory-viewer.invalid:__AGENTMEMORY_VIEWER_PORT__"]
        allowed_methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
  - name: iii-state
    config:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: "__AGENTMEMORY_DATA_ROOT_POSIX__/state_store.db"
  - name: iii-queue
    config:
      adapter:
        name: builtin
  - name: iii-pubsub
    config:
      adapter:
        name: local
  - name: iii-cron
    config:
      adapter:
        name: kv
  - name: iii-stream
    config:
      port: __AGENTMEMORY_STREAM_PORT__
      host: 127.0.0.1
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: "__AGENTMEMORY_DATA_ROOT_POSIX__/stream_store"
  - name: iii-observability
    config:
      enabled: true
      service_name: agentmemory
      exporter: memory
      # 0.1 sampling: full sampling under load makes the log subscriber lag,
      # the lag WARN re-enters the stream it cannot drain, and the feedback
      # loop once wrote 137 GB of logs (upstream #519). Keep at 0.1.
      sampling_ratio: 0.1
      metrics_enabled: true
      logs_enabled: true
      logs_console_output: false
